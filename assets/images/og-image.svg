<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Odak Apart Otel — İkinci Eviniz, Ayvalık Altınova">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f4152"/>
      <stop offset="0.48" stop-color="#1c2b3a"/>
      <stop offset="1" stop-color="#33261d"/>
    </linearGradient>
    <radialGradient id="ogGlowA" cx="0.16" cy="0.12" r="0.62">
      <stop offset="0" stop-color="#c9a678" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#c9a678" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ogGlowB" cx="0.9" cy="0.92" r="0.6">
      <stop offset="0" stop-color="#7c5030" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5030" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ogWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a678"/><stop offset="1" stop-color="#7c5030"/>
    </linearGradient>
  </defs>

  <!-- Zemin -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#ogGlowA)"/>
  <rect width="1200" height="630" fill="url(#ogGlowB)"/>

  <!-- İnce doku çizgileri -->
  <g opacity="0.05" stroke="#f8f3ea" stroke-width="1">
    <path d="M-100 120 L1300 -180"/><path d="M-100 220 L1300 -80"/><path d="M-100 320 L1300 20"/>
    <path d="M-100 420 L1300 120"/><path d="M-100 520 L1300 220"/><path d="M-100 620 L1300 320"/>
    <path d="M-100 720 L1300 420"/><path d="M-100 820 L1300 520"/>
  </g>

  <!-- Logo rozeti -->
  <circle cx="94" cy="86" r="30" fill="url(#ogWood)"/>
  <text x="94" y="97" font-family="Montserrat, Segoe UI, sans-serif" font-size="24" font-weight="800"
        fill="#f8f3ea" text-anchor="middle">OA</text>
  <text x="140" y="80" font-family="Montserrat, Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#f8f3ea">Odak Apart Otel</text>
  <text x="140" y="104" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600"
        fill="#c9a678" letter-spacing="2.4">İKİNCİ EVİNİZ</text>

  <!-- Eyebrow -->
  <rect x="94" y="228" width="46" height="3" fill="#c9a678"/>
  <text x="156" y="235" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600"
        fill="#c9a678" letter-spacing="3.6">AYVALIK · ALTINOVA</text>

  <!-- Ana başlık -->
  <text x="94" y="316" font-family="Montserrat, Segoe UI, sans-serif" font-size="72" font-weight="800" fill="#f8f3ea">Odak Apart Otel</text>
  <text x="94" y="398" font-family="Montserrat, Segoe UI, sans-serif" font-size="72" font-weight="800" fill="#c9a678">İkinci Eviniz</text>

  <!-- Alt açıklama -->
  <text x="94" y="452" font-family="Inter, Segoe UI, sans-serif" font-size="24" fill="#d9d2c6">Aile sıcaklığında, nezih ve huzurlu bir tatil.</text>

  <!-- İstatistik şeridi -->
  <g>
    <rect x="94" y="506" width="3" height="52" fill="#c9a678"/>
    <text x="116" y="533" font-family="Montserrat, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#f8f3ea">27</text>
    <text x="116" y="555" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#b9b1a4">Daire</text>

    <rect x="238" y="506" width="3" height="52" fill="#c9a678"/>
    <text x="260" y="533" font-family="Montserrat, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#f8f3ea">400 m</text>
    <text x="260" y="555" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#b9b1a4">Denize mesafe</text>

    <rect x="446" y="506" width="3" height="52" fill="#c9a678"/>
    <text x="468" y="533" font-family="Montserrat, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#f8f3ea">30+ Yıl</text>
    <text x="468" y="555" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#b9b1a4">Aile işletmesi</text>
  </g>

  <!-- Sağ dekoratif kart: pergola/teras silüeti -->
  <g transform="translate(772,150)">
    <rect x="0" y="0" width="336" height="330" rx="26" fill="#f3ead9" opacity="0.07"/>
    <rect x="26" y="26" width="284" height="278" rx="16" fill="#cfe6ea" opacity="0.18"/>
    <!-- deniz -->
    <rect x="26" y="176" width="284" height="46" fill="#9cc0d6" opacity="0.45"/>
    <path d="M26 222 q40-12 80 0 t80 0 t80 0 t44 0 v82 H26z" fill="#c9a678" opacity="0.32"/>
    <!-- güneş -->
    <circle cx="248" cy="92" r="30" fill="#f6e2a8" opacity="0.75"/>
    <!-- pergola -->
    <rect x="60" y="96" width="9" height="150" fill="#c9a678" opacity="0.85"/>
    <rect x="262" y="96" width="9" height="150" fill="#c9a678" opacity="0.85"/>
    <rect x="48" y="88" width="236" height="10" rx="4" fill="#a97a50" opacity="0.9"/>
    <g stroke="#c9a678" stroke-width="5" stroke-linecap="round" opacity="0.8">
      <line x1="100" y1="100" x2="100" y2="116"/>
      <line x1="146" y1="100" x2="146" y2="116"/>
      <line x1="192" y1="100" x2="192" y2="116"/>
      <line x1="238" y1="100" x2="238" y2="116"/>
    </g>
    <!-- masa -->
    <ellipse cx="166" cy="258" rx="72" ry="16" fill="#a97a50" opacity="0.9"/>
    <rect x="162" y="266" width="8" height="38" fill="#8a6440" opacity="0.9"/>
  </g>

  <!-- Alt bilgi şeridi -->
  <rect x="0" y="586" width="1200" height="44" fill="#0f1821" opacity="0.55"/>
  <text x="94" y="614" font-family="Inter, Segoe UI, sans-serif" font-size="17" fill="#d9d2c6">Altınova Mah. Anafartalar Cad. No:136, Ayvalık / Balıkesir</text>
  <text x="1106" y="614" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600"
        fill="#c9a678" text-anchor="end">0530 720 71 71</text>
</svg>
