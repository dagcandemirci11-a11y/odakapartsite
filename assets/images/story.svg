<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-label="Odak Apart Otel bahçe ve teras atmosferi">
  <defs>
    <linearGradient id="stSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe6ea"/><stop offset="1" stop-color="#f0e7d5"/>
    </linearGradient>
    <linearGradient id="stWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a678"/><stop offset="1" stop-color="#9c6f47"/>
    </linearGradient>
    <linearGradient id="stFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c2a0"/><stop offset="1" stop-color="#c7ad86"/>
    </linearGradient>
  </defs>

  <!-- Zemin -->
  <rect width="640" height="720" fill="url(#stSky)"/>

  <!-- Deniz şeridi -->
  <rect x="0" y="250" width="640" height="70" fill="#a9cdd6"/>
  <path d="M0 300 q80-16 160 0 t160 0 t160 0 t160 0 v40 H0z" fill="#8fb9c4" opacity="0.7"/>

  <!-- Uzak tepeler -->
  <path d="M0 260 q120-60 260-30 q160-50 380-10 v60 H0z" fill="#9db98a" opacity="0.55"/>

  <!-- Teras zemini -->
  <rect x="0" y="470" width="640" height="250" fill="url(#stFloor)"/>
  <g stroke="#b89a6e" stroke-width="2" opacity="0.5">
    <line x1="0" y1="520" x2="640" y2="520"/>
    <line x1="0" y1="580" x2="640" y2="580"/>
    <line x1="0" y1="645" x2="640" y2="645"/>
  </g>

  <!-- Pergola direkleri -->
  <rect x="60" y="120" width="18" height="360" fill="url(#stWood)"/>
  <rect x="562" y="120" width="18" height="360" fill="url(#stWood)"/>
  <rect x="40" y="112" width="560" height="18" rx="6" fill="#8a6440"/>
  <g stroke="#a97a50" stroke-width="10" stroke-linecap="round">
    <line x1="120" y1="130" x2="120" y2="150"/>
    <line x1="220" y1="130" x2="220" y2="150"/>
    <line x1="320" y1="130" x2="320" y2="150"/>
    <line x1="420" y1="130" x2="420" y2="150"/>
    <line x1="520" y1="130" x2="520" y2="150"/>
  </g>

  <!-- Sarmaşık -->
  <path d="M40 112 q30 40 10 90 q40-20 60 20 q10-50 -20-70 q-20 -40 -50 -40z" fill="#6f9a58" opacity="0.9"/>
  <path d="M600 112 q-30 50 -6 100 q-44-16 -66 26 q-6-54 26-74 q18-42 46-52z" fill="#6f9a58" opacity="0.9"/>

  <!-- Ahşap masa -->
  <ellipse cx="320" cy="560" rx="150" ry="34" fill="#a97a50"/>
  <ellipse cx="320" cy="548" rx="150" ry="34" fill="url(#stWood)"/>
  <rect x="312" y="570" width="16" height="90" fill="#8a6440"/>
  <rect x="250" y="650" width="140" height="14" rx="6" fill="#8a6440"/>

  <!-- İki çay bardağı -->
  <g>
    <path d="M270 520 h34 l-4 26 h-26z" fill="#f3ead9"/>
    <ellipse cx="287" cy="520" rx="17" ry="5" fill="#c0603f"/>
    <path d="M304 526 q12 2 10 12 q-2 8 -12 6" fill="none" stroke="#e2d3ba" stroke-width="3"/>
  </g>
  <g>
    <path d="M340 520 h34 l-4 26 h-26z" fill="#f3ead9"/>
    <ellipse cx="357" cy="520" rx="17" ry="5" fill="#c0603f"/>
    <path d="M374 526 q12 2 10 12 q-2 8 -12 6" fill="none" stroke="#e2d3ba" stroke-width="3"/>
  </g>

  <!-- Saksı bitki -->
  <rect x="470" y="600" width="60" height="70" rx="8" fill="#b98552"/>
  <path d="M500 600 q-40-56 -16-110 q34 40 16 110 q40-52 62-92 q-6 54 -62 92z" fill="#6f9a58"/>

  <!-- Güneş parıltısı -->
  <circle cx="120" cy="80" r="34" fill="#f6e2a8" opacity="0.85"/>
</svg>
